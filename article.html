<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章详情 — 郑医有话</title>
    <style>
        :root {
            --color-bg: #FFFFFF;
            --color-text: #1A1A1A;
            --color-muted: #6B7280;
            --color-gold: #C8A45C;
            --color-gold-light: #E8D5A3;
            --color-card-bg: #F7F7F5;
            --color-border: #E5E5E3;
            --font-main: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --max-width: 760px;
            --transition: cubic-bezier(0.4, 0, 0.2, 1);
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; }
        body { font-family: var(--font-main); background: var(--color-bg); color: var(--color-text); line-height: 1.8; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }

        /* Nav */
        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--color-border); }
        .nav-inner { max-width: 900px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .nav-logo { font-size: 1.125rem; font-weight: 700; letter-spacing: 0.02em; }
        .nav-logo span { color: var(--color-gold); }
        .back-link { font-size: 0.875rem; color: var(--color-muted); display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .back-link:hover { color: var(--color-gold); }
        .back-link svg { width: 16px; height: 16px; }

        /* Article */
        .article-page { padding-top: 100px; padding-bottom: 80px; }
        .article-container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
        .article-header { margin-bottom: 48px; }
        .article-header .category-badge { display: inline-block; padding: 4px 14px; border-radius: 14px; background: rgba(200,164,92,0.1); color: var(--color-gold); font-size: 0.8125rem; font-weight: 500; margin-bottom: 16px; }
        .article-header h1 { font-size: 2rem; font-weight: 700; line-height: 1.4; margin-bottom: 16px; }
        .article-header .meta { font-size: 0.875rem; color: var(--color-muted); display: flex; align-items: center; gap: 16px; }
        .article-header .meta svg { width: 14px; height: 14px; stroke: var(--color-gold); }
        .article-divider { width: 40px; height: 1px; background: var(--color-gold); margin-bottom: 40px; }

        /* Content styles */
        .article-content { font-size: 1.0625rem; color: #333; }
        .article-content h2 { font-size: 1.375rem; font-weight: 600; margin-top: 40px; margin-bottom: 16px; color: var(--color-text); }
        .article-content h3 { font-size: 1.125rem; font-weight: 600; margin-top: 32px; margin-bottom: 12px; }
        .article-content p { margin-bottom: 16px; }
        .article-content ul, .article-content ol { margin-bottom: 16px; padding-left: 24px; }
        .article-content li { margin-bottom: 8px; }
        .article-content strong { color: var(--color-text); }
        .article-content blockquote { border-left: 3px solid var(--color-gold); padding-left: 20px; margin: 24px 0; color: var(--color-muted); font-style: italic; }

        /* Video embed */
        .article-video-section { margin-top: 48px; padding-top: 40px; border-top: 1px solid var(--color-border); }
        .article-video-section h3 { font-size: 1.125rem; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .article-video-section h3 svg { width: 20px; height: 20px; stroke: var(--color-gold); }
        .video-embed-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--color-card-bg); border: 1px solid var(--color-border); margin-bottom: 12px; }
        .video-embed-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .video-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--color-muted); gap: 12px; }
        .video-placeholder svg { width: 48px; height: 48px; stroke: var(--color-gold); }
        .video-placeholder span { font-size: 0.875rem; }
        .video-link { display: inline-block; margin-top: 8px; font-size: 0.875rem; color: var(--color-gold); font-weight: 500; transition: opacity 0.2s; }
        .video-link:hover { opacity: 0.7; }

        /* Footer nav */
        .article-footer { margin-top: 60px; padding-top: 32px; border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
        .article-footer a { font-size: 0.875rem; color: var(--color-muted); display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
        .article-footer a:hover { color: var(--color-gold); }
        .article-footer a svg { width: 16px; height: 16px; }

        /* Error state */
        .error-page { text-align: center; padding: 200px 24px 80px; }
        .error-page h2 { font-size: 1.5rem; margin-bottom: 16px; }
        .error-page p { color: var(--color-muted); margin-bottom: 32px; }
        .error-page a { display: inline-block; padding: 12px 32px; border: 1px solid var(--color-gold); color: var(--color-gold); font-size: 0.875rem; font-weight: 500; transition: all 0.3s; }
        .error-page a:hover { background: var(--color-gold); color: #fff; }

        @media (max-width: 768px) {
            .article-header h1 { font-size: 1.5rem; }
            .article-content { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">郑医<span>有话</span></a>
            <a href="index.html#articles" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                返回
            </a>
        </div>
    </nav>

    <div class="article-page">
        <div class="article-container" id="articleContainer">
            <!-- Dynamic content -->
        </div>
    </div>

    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="video-store.js"></script>
    <script src="supabase-adapter.js"></script>
    <script src="zy-store.js"></script>
    <script>
        const container = document.getElementById('articleContainer');
        const params = new URLSearchParams(window.location.search);
        const articleId = params.get('id');

        (async () => {
            if (!articleId) {
                showError();
            } else {
                const article = await zyStore.getArticleById(articleId);
                if (!article || !article.published) {
                    showError();
                } else {
                    document.title = article.title + ' — 郑医有话';
                    await renderArticle(article);
                }
            }
        })();

        function showError() {
            container.innerHTML = `
                <div class="error-page">
                    <h2>文章不存在</h2>
                    <p>您访问的文章可能已被删除或尚未发布</p>
                    <a href="index.html">返回首页</a>
                </div>
            `;
        }

        async function renderArticle(a) {
            const allArticles = await zyStore.getArticles();
            const currentIdx = allArticles.findIndex(item => item.id === a.id);
            const prev = currentIdx < allArticles.length - 1 ? allArticles[currentIdx + 1] : null;
            const next = currentIdx > 0 ? allArticles[currentIdx - 1] : null;

            let videoHTML = '';
            const hasStorageKey = a.videoStorageKey && a.videoStorageKey.trim();
            const hasStoragePath = a.videoStoragePath && a.videoStoragePath.trim();
            const hasEmbedCode = a.videoEmbedCode && a.videoEmbedCode.trim();
            const hasVideoUrl = a.videoUrl && a.videoUrl.trim();
            let videoContent = '';

            if (hasStorageKey || hasStoragePath) {
                const blobUrl = await zyStore.getVideoFileURL(a);
                if (blobUrl) {
                    videoContent = `<video controls preload="metadata" style="width:100%;height:100%;display:block;background:#000;"><source src="${blobUrl}">您的浏览器不支持视频播放</video>`;
                }
            } else if (hasEmbedCode) {
                videoContent = a.videoEmbedCode;
            } else if (hasVideoUrl) {
                videoContent = getEmbedHTML(a.videoUrl);
            }

            if (videoContent) {
                videoHTML = `
                    <div class="article-video-section">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                            相关视频
                        </h3>
                        <div class="video-embed-wrapper">
                            ${videoContent}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="article-header">
                    <span class="category-badge">${a.category}</span>
                    <h1>${a.title}</h1>
                    <div class="meta">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span>${a.date}</span>
                        <span style="color:var(--color-border)">|</span>
                        <span>${a.category}</span>
                    </div>
                </div>
                <div class="article-divider"></div>
                <div class="article-content">${a.content}</div>
                ${videoHTML}
                <div class="article-footer">
                    ${prev ? `<a href="article.html?id=${prev.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>${prev.title}</a>` : '<span></span>'}
                    ${next ? `<a href="article.html?id=${next.id}">${next.title}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></a>` : '<span></span>'}
                </div>
            `;
        }

        function getEmbedHTML(url) {
            if (!url) return '';
            // bilibili
            const biliMatch = url.match(/bilibili\.com\/video\/(BV[\w]+)/);
            if (biliMatch) {
                return `<iframe src="https://player.bilibili.com/player.html?bvid=${biliMatch[1]}&autoplay=0" allowfullscreen scrolling="no" frameborder="0"></iframe>`;
            }
            // YouTube
            const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
            if (ytMatch) {
                return `<iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" frameborder="0"></iframe>`;
            }
            // 腾讯视频
            const txMatch = url.match(/v\.qq\.com\/x\/page\/(\w+)/);
            if (txMatch) {
                return `<iframe src="https://v.qq.com/txp/iframe/player.html?vid=${txMatch[1]}" allowfullscreen frameborder="0"></iframe>`;
            }
            // 通用：直接打开链接
            return `
                <div class="video-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                    <span>视频链接</span>
                    <a class="video-link" href="${url}" target="_blank">点击观看视频 →</a>
                </div>
            `;
        }
    </script>
</body>
</html>
